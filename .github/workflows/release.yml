name: Release

# Two ways to release, both ending in a tagged GitHub release with the
# .vsix attached:
#
#   - Actions → Release → "Run workflow": tags the current commit with
#     v<version from package.json> and releases it.
#   - git tag v0.8.0 && git push origin v0.8.0
#
# Either way the tag and package.json have to agree, so a release is
# always reproducible from its tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out which tag to release
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Started by a tag: it has to match the manifest.
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::Tag $tag does not match package.json version $version"
              exit 1
            fi
          else
            # Started by hand: the manifest decides the tag.
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag is already released - bump the version in package.json and add a CHANGELOG.md section first"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=abap2ui5-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - run: npm ci
      - run: npm run lint
      - run: npm run vsix

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.vsix }}
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

      # Only for a manual run - a tag-triggered run already has its tag.
      # Pushing with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop back into the tag trigger above.
      - name: Tag the commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      # Release notes come from the matching CHANGELOG.md section.
      - name: Collect the release notes
        run: |
          version="${{ steps.meta.outputs.version }}"
          awk -v header="## $version" '
            $0 == header { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version - see CHANGELOG.md." > release-notes.md
          fi
          {
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "code --install-extension ${{ steps.meta.outputs.vsix }}"
            echo '```'
            echo ""
            echo "Or: Extensions panel → \`…\` menu → **Install from VSIX…**"
          } >> release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.vsix }}" \
            --title "abap2UI5 ${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md
