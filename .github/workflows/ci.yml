name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The bundled linter declares engines >= 22; npm only warns today,
          # but there is no reason for CI to build on a version the toolchain
          # says it does not support.
          node-version: 22
          cache: npm

      - run: npm ci

      # Same four commands AGENTS.md asks for before pushing.
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: npm run vsix

      # The .vsix of every branch, installable straight from the run page.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
